name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI (Redocly)
        run: npx --yes @redocly/cli@1 lint openapi.yaml
      - name: Run tests (no network, no live sends)
        run: node --test
